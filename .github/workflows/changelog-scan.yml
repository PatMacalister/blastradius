name: changelog-scan

# Mechanism B: early warning on *announced* provider changes, so deprecations arrive with
# lead time instead of on the cutover date.
#
# Runs a day before the contract tests, so an announced change is already on record when
# the live assertion breaks.

on:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Seen-entry state persists between runs; without it every run reports everything
      # and the whole thing becomes noise on week two.
      - name: Restore changelog state
        uses: actions/cache@v4
        with:
          path: tools/.changelog-state
          key: changelog-state-${{ github.run_id }}
          restore-keys: changelog-state-

      - name: Scan provider changelogs
        id: scan
        continue-on-error: true
        run: |
          node tools/changelog-scan.mjs | tee changelog-report.txt
          echo "found=$?" >> "$GITHUB_OUTPUT"

      - name: Open an issue when something auth-relevant changed
        if: steps.scan.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('changelog-report.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Provider changelog: auth-relevant changes detected',
              labels: ['drift'],
              body: [
                'The changelog scanner found provider changes matching auth/permission vocabulary.',
                'Check whether any affect scope parsing or the capability mapping.',
                '',
                '```',
                body.slice(0, 60000),
                '```',
              ].join('\n'),
            });
