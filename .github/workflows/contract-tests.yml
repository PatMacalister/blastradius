name: contract-tests

# Mechanism A: catch silent semantic drift in provider APIs.
# Weekly is enough — auth models do not change daily — plus on any PR that touches a
# provider module, which is the gate that makes community contributions reviewable.

on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - 'src/providers/**'
      - 'src/core/capabilities.mjs'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: npm test

      - name: Contract tests against live provider APIs
        env:
          # Low-privilege, non-destructive credentials. See CONTRIBUTING.md.
          # A provider with no secret configured skips rather than fails, so a fork's PR
          # still runs the unit suite and the contract validator.
          #
          # EVERY provider must be listed here. A provider whose variables are missing
          # skips silently, and a silent skip reads exactly like a pass — this list was
          # written in Phase 0 with two providers and did not grow when four more shipped,
          # which would have meant four modules quietly unverified on a green build.
          BLASTRADIUS_TEST_GITHUB: ${{ secrets.BLASTRADIUS_TEST_GITHUB }}
          BLASTRADIUS_EXPECT_GITHUB: ${{ vars.BLASTRADIUS_EXPECT_GITHUB }}
          BLASTRADIUS_TEST_STRIPE: ${{ secrets.BLASTRADIUS_TEST_STRIPE }}
          BLASTRADIUS_EXPECT_STRIPE: ${{ vars.BLASTRADIUS_EXPECT_STRIPE }}
          BLASTRADIUS_TEST_RAILWAY: ${{ secrets.BLASTRADIUS_TEST_RAILWAY }}
          BLASTRADIUS_EXPECT_RAILWAY: ${{ vars.BLASTRADIUS_EXPECT_RAILWAY }}
          BLASTRADIUS_TEST_SUPABASE: ${{ secrets.BLASTRADIUS_TEST_SUPABASE }}
          BLASTRADIUS_EXPECT_SUPABASE: ${{ vars.BLASTRADIUS_EXPECT_SUPABASE }}
          BLASTRADIUS_TEST_VERCEL: ${{ secrets.BLASTRADIUS_TEST_VERCEL }}
          BLASTRADIUS_EXPECT_VERCEL: ${{ vars.BLASTRADIUS_EXPECT_VERCEL }}
          BLASTRADIUS_TEST_CLOUDFLARE: ${{ secrets.BLASTRADIUS_TEST_CLOUDFLARE }}
          BLASTRADIUS_EXPECT_CLOUDFLARE: ${{ vars.BLASTRADIUS_EXPECT_CLOUDFLARE }}
        run: npm run test:contract

      - name: Report drift
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "::error::Contract tests failed on the scheduled run."
          echo "Either a provider changed its API, or a test credential expired."
          echo "Do NOT re-stamp lastVerified until the cause is known."
