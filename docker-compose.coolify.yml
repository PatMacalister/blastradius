# BlastRadius drift machinery — Coolify deployment.
#
# The same two services as docker-compose.yml, adjusted for how Coolify actually runs a
# compose file. Use this one in Coolify; use docker-compose.yml locally. Three differences,
# each of which would otherwise fail silently or confusingly:
#
#   1. NO `profiles:`. Coolify runs the equivalent of `docker compose up` with no --profile
#      flags, so a profile-gated service is simply never started. In the main file
#      contract-tests sits behind `profiles: ["contract"]` — on Coolify that means the live
#      API verification quietly never runs, while the deployment shows green. That is the
#      silent-coverage failure this project keeps having to design against.
#
#   2. NO `env_file:`. ops/contract-tests.env is gitignored, so it does not exist in the
#      repository Coolify clones, and a missing env_file aborts the deploy. Credentials come
#      from Coolify's own environment-variable store instead, substituted below. That is also
#      the better place for them: they are encrypted at rest and never sit in a file.
#
#   3. NO `container_name:`. Coolify manages container naming per deployment; fixed names
#      collide across redeploys.
#
# THE LANDING PAGE AND THE CREDENTIALS ARE DELIBERATELY NOT ON THE SAME NETWORK.
#
# contract-tests holds six live provider credentials. `landing` is the only thing here that
# accepts inbound traffic. Putting both on compose's default network would let a compromised
# web container reach the one holding the credentials — a small version of the exact story
# this tool exists to tell. So the drift services declare their own network and the landing
# container does not: Docker gives no route between two networks a container does not share.
#
# The isolation has to be done from the drift side, not the landing side. Putting `landing` on
# a named network of its own excludes Coolify's proxy too, and the site answers 504.
#
# `drift` is deliberately NOT `internal: true`. That flag severs outbound traffic as well as
# inbound, and both drift services exist to make outbound calls — provider APIs and changelog
# feeds. Marking it internal would leave the containers running and quietly unable to do the
# one thing they are for, which reads as a healthy deployment.
#
# The page is served by stock nginx rather than by adding an HTTP server to the BlastRadius
# image. The claim on the page is "there is nothing to audit but the tool itself"; hand-rolling
# static file serving, path traversal and all, would quietly stop that being true.
#
# The files are COPIED INTO an image (Dockerfile.landing), not bind-mounted. A relative bind
# mount is an assumption about the host checkout layout, and when it is wrong Docker mounts an
# empty directory and nginx answers 403 — which is exactly how the first deployment failed.
#
# SET THESE IN COOLIFY → your resource → Environment Variables. A provider whose TEST value is
# empty skips its contract test and still exits 0, so a partially configured deployment looks
# exactly like a fully passing one. Set all twelve, or knowingly accept the blind spot:
#
#   BLASTRADIUS_TEST_GITHUB      BLASTRADIUS_EXPECT_GITHUB
#   BLASTRADIUS_TEST_STRIPE      BLASTRADIUS_EXPECT_STRIPE
#   BLASTRADIUS_TEST_RAILWAY     BLASTRADIUS_EXPECT_RAILWAY
#   BLASTRADIUS_TEST_SUPABASE    BLASTRADIUS_EXPECT_SUPABASE
#   BLASTRADIUS_TEST_VERCEL      BLASTRADIUS_EXPECT_VERCEL
#   BLASTRADIUS_TEST_CLOUDFLARE  BLASTRADIUS_EXPECT_CLOUDFLARE
#
# These are live credentials on a machine you do not physically control. Every one of them
# must be non-destructive and issued from a dedicated throwaway account — see
# ops/contract-tests.env.example — and rotation is not optional: ops/ROTATION-RUNBOOK.md.

services:
  # Mechanism B — announced-change early warning. Holds no credentials, needs no ingress,
  # and is the safe thing to leave running permanently.
  changelog-watch:
    build: .
    restart: unless-stopped
    environment:
      INTERVAL_SECONDS: "604800"   # weekly — provider auth models do not change daily
      RUN_AT_START: "1"
    volumes:
      # Without this, every redeploy re-reports every changelog entry as new and the digest
      # becomes noise — the exact failure mode that gets a watcher muted.
      - changelog-state:/app/tools/.changelog-state
    command: ["sh", "tools/watch-loop.sh", "node", "tools/changelog-scan.mjs"]
    networks: [drift]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Mechanism A — contract tests against live provider APIs. This is the service that makes
  # `lastVerified` a promise rather than a claim.
  contract-tests:
    build: .
    restart: unless-stopped
    environment:
      INTERVAL_SECONDS: "604800"
      RUN_AT_START: "1"
      # Exit 1 here means assertions failed, not "news to read". See tools/watch-loop.sh.
      WATCH_MODE: "test"
      BLASTRADIUS_TEST_GITHUB: ${BLASTRADIUS_TEST_GITHUB:-}
      BLASTRADIUS_EXPECT_GITHUB: ${BLASTRADIUS_EXPECT_GITHUB:-}
      BLASTRADIUS_TEST_STRIPE: ${BLASTRADIUS_TEST_STRIPE:-}
      BLASTRADIUS_EXPECT_STRIPE: ${BLASTRADIUS_EXPECT_STRIPE:-}
      BLASTRADIUS_TEST_RAILWAY: ${BLASTRADIUS_TEST_RAILWAY:-}
      BLASTRADIUS_EXPECT_RAILWAY: ${BLASTRADIUS_EXPECT_RAILWAY:-}
      BLASTRADIUS_TEST_SUPABASE: ${BLASTRADIUS_TEST_SUPABASE:-}
      BLASTRADIUS_EXPECT_SUPABASE: ${BLASTRADIUS_EXPECT_SUPABASE:-}
      BLASTRADIUS_TEST_VERCEL: ${BLASTRADIUS_TEST_VERCEL:-}
      BLASTRADIUS_EXPECT_VERCEL: ${BLASTRADIUS_EXPECT_VERCEL:-}
      BLASTRADIUS_TEST_CLOUDFLARE: ${BLASTRADIUS_TEST_CLOUDFLARE:-}
      BLASTRADIUS_EXPECT_CLOUDFLARE: ${BLASTRADIUS_EXPECT_CLOUDFLARE:-}
    command: ["sh", "tools/watch-loop.sh", "node", "--test", "test/contract/providers.contract.test.mjs"]
    networks: [drift]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The static landing page. No credentials, no application code — the files are baked into
  # the image by Dockerfile.landing rather than bind-mounted.
  #
  # The install section is live and correct: @mediaforge/blastradius is published, and the
  # page tells visitors the scoped name. It was held back from the real domain until that was
  # true, which is what the LAUNCH-GATE comment in public/index.html used to guard.
  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    restart: unless-stopped
    # Deliberately NO `networks:` key. Declaring one puts the container on that network ONLY,
    # which locks out Coolify's reverse proxy — the proxy cannot reach it and every request
    # times out at the gateway. Left undeclared, it joins the compose default network and
    # Coolify attaches its proxy network alongside.
    #
    # Isolation is preserved by the other half: changelog-watch and contract-tests declare
    # `networks: [drift]`, so they are NOT on the default network and this container has no
    # route to the one holding six live credentials.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Only the drift services get a declared network. `landing` stays on the compose default so
  # Coolify's proxy can route to it. Not `internal: true` — that would sever outbound, and
  # both drift services exist to make outbound calls.
  drift:

volumes:
  changelog-state:
